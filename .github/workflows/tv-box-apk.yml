# Builds the Siqa TV box app (android-tv/) and attaches the APK to the run.
# Download it from Actions → "TV box APK" → the latest run → Artifacts → siqa-box-apk.
#
# Optional signing (so updates install over each other on every box): add these secrets
#   SIQA_BOX_KEYSTORE_B64 (base64 of a .jks), SIQA_BOX_KEYSTORE_PASSWORD, SIQA_BOX_KEY_ALIAS, SIQA_BOX_KEY_PASSWORD
# Without them the APK is signed with the runner's debug key, which is fine for testing.

name: TV box APK

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/tv-box-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keystore
        env:
          KS: ${{ secrets.SIQA_BOX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/siqa-box.jks"; echo "SIQA_BOX_KEYSTORE=$RUNNER_TEMP/siqa-box.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          SIQA_BOX_KEYSTORE_PASSWORD: ${{ secrets.SIQA_BOX_KEYSTORE_PASSWORD }}
          SIQA_BOX_KEY_ALIAS: ${{ secrets.SIQA_BOX_KEY_ALIAS }}
          SIQA_BOX_KEY_PASSWORD: ${{ secrets.SIQA_BOX_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: siqa-box-apk
          path: android-tv/app/build/outputs/apk/release/*.apk
