# Build the Siqa iPhone app on Expo's servers and (optionally) send it to
# App Store Connect / TestFlight. Run it from GitHub: Actions tab →
# "iOS build" → Run workflow. Only people with write access can run it.
#
# Secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN          required. Expo access token (expo.dev → Account settings → Access tokens).
#   ASC_API_KEY_P8      optional. Contents of the App Store Connect API key (.p8 file).
#   ASC_API_KEY_ID      optional. That key's Key ID.
#   ASC_API_ISSUER_ID   optional. The Issuer ID shown on the same page.
#   APPLE_TEAM_ID       optional. Your 10-character Apple Team ID (developer.apple.com → Membership).
# With the three ASC secrets, Expo can create signing certificates and upload
# to TestFlight on its own. Without them, Apple signing must already be set up
# on Expo (one local `eas build -p ios` run does that).

name: iOS build

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Send the finished build to App Store Connect (TestFlight)
        type: boolean
        default: true

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: App Store Connect key (optional)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Pasted IDs often carry a trailing newline/space; strip all whitespace.
          TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          KEY_ID=$(printf '%s' "$ASC_API_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ASC_API_ISSUER_ID" | tr -d '[:space:]')
          if [ -n "$TEAM_ID" ]; then echo "EXPO_APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"; fi
          if [ -n "$ASC_API_KEY_P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ]; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"
            if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc_key.p8"; then
              echo "::error::ASC_API_KEY_P8 should be the whole .p8 file, including the -----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines."
              exit 1
            fi
            {
              echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_key.p8"
              echo "EXPO_ASC_KEY_ID=$KEY_ID"
              echo "EXPO_ASC_ISSUER_ID=$ISSUER_ID"
            } >> "$GITHUB_ENV"
            echo "Using the App Store Connect API key (key ${KEY_ID:0:3}…, team ${TEAM_ID:0:3}…)."
          else
            echo "No App Store Connect key; using signing already saved on Expo."
          fi

      - name: Build on Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          SUBMIT=""
          if [ "${{ inputs.submit }}" = "true" ]; then SUBMIT="--auto-submit"; fi
          if ! npx --yes eas-cli@latest build -p ios --profile production --non-interactive --no-wait $SUBMIT; then
            echo "::error::Build didn't start. If the log says 'Credentials are not set up', run 'npx eas-cli@latest credentials -p ios' once on your computer (choose production → set up everything), or add the ASC_API_KEY_* secrets, then run this again."
            exit 1
          fi
          echo "Build started. Follow it at https://expo.dev (Projects → siqa → Builds)."
