<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      This is the real HTML shell for the web app. app.json uses
      web.output = "single-page", and in that mode Expo ignores
      app/+html.tsx entirely and uses this file as the template instead
      (keep the two in sync if you ever switch to "static" output).
    -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Siqa</title>
    <meta name="description" content="Siqa — trusted Islamic talks from real scholars, a Muslim marketplace, and causes worth supporting." />

    <!-- Default link-preview tags. Shared /watch, /gems?videoId, /product,
         /seed and /speaker links get page-specific ones from api/og.js. -->
    <meta property="og:site_name" content="Siqa" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Siqa" />
    <meta property="og:description" content="Siqa — trusted Islamic talks from real scholars, a Muslim marketplace, and causes worth supporting." />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Installable web app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0F1C" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Siqa" />
    <!-- "black" (not black-translucent) and no viewport-fit=cover: the app's
         headers use a fixed web top padding, not safe-area insets, so letting
         content run under the iPhone status bar/home indicator would clip it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Brand fonts: Inter for text, Inter Tight for titles and money
         (self-hosted, variable weight 100–900, SIL Open Font License). Arabic falls back to
         the system font automatically since Inter has no Arabic glyphs. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Chai only: Fredoka (rounded headings) and Space Mono (labels). SIL OFL. */
      @font-face { font-family: 'Fredoka'; font-style: normal; font-display: swap; font-weight: 600; src: url('/fonts/fredoka-600.ttf') format('truetype'); }
      @font-face { font-family: 'Fredoka'; font-style: normal; font-display: swap; font-weight: 700; src: url('/fonts/fredoka-700.ttf') format('truetype'); }
      @font-face { font-family: 'Space Mono'; font-style: normal; font-display: swap; font-weight: 700; src: url('/fonts/space-mono-700.ttf') format('truetype'); }
      @font-face {
        font-family: 'Inter Tight';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-tight-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter Tight';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-tight-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Higher specificity than react-native-web's text class, but lower
         than inline styles — so icon fonts (Ionicons sets font-family
         inline) keep working. */
      html body, html body [dir="auto"], html body input, html body textarea, html body button {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: 'cv11' 1, 'ss03' 1;
      }

      /* ── Hover & focus feedback (desktop/mouse only) ──────────────────
         Every Touchable/Pressable renders as div[tabindex="0"]. React
         Native has no hover concept, so the app had no hover feedback at
         all. One rule here gives every clickable thing a response, and
         data-hover (set via dataSet={{ hover: … }}) opts specific
         surfaces into richer effects:
           card  – lifts and zooms its [data-hover-media] image
           lift  – lifts with a soft shadow (bordered cards)
           row   – soft background tint (nav items, list rows)
           none  – no effect (full-screen video, etc.) */
      @media (hover: hover) and (pointer: fine) {
        div[tabindex="0"] {
          cursor: pointer;
          transition: background-color 0.15s ease, filter 0.15s ease, transform 0.2s ease,
                      box-shadow 0.2s ease, opacity 0.15s ease, border-color 0.15s ease !important;
        }
        div[tabindex="0"]:not([data-hover]):hover { filter: brightness(0.95); }
        [data-hover="card"]:hover { transform: translateY(-2px); }
        [data-hover="lift"]:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 28px rgba(15, 15, 15, 0.08), 0 2px 6px rgba(15, 15, 15, 0.04);
        }
        [data-hover="row"]:hover { background-color: rgba(20, 20, 20, 0.045) !important; }
        [data-hover-media] { transition: transform 0.35s ease !important; }
        [data-hover="card"]:hover [data-hover-media],
        [data-hover="lift"]:hover [data-hover-media] { transform: scale(1.04); }
      }
      div[tabindex="0"]:focus { outline: none; }
      div[tabindex="0"]:focus-visible { outline: 2px solid #A8843F; outline-offset: 2px; border-radius: 10px; }
    </style>

    <!-- react-native-web recommended style reset -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <style>
      /* Match the app background so overscroll / slow loads never flash white. */
      html, body { background-color: #FFFFFF; }
      /* Do NOT add `* { overscroll-behavior: none }` here: it breaks touch
         scrolling on Home and Shop in mobile Chrome (nested scroll views). */
      @media (prefers-color-scheme: dark) {
        html, body { background-color: #0A0F1C; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Siqa.</noscript>
    <div id="root"></div>
  </body>
</html>
